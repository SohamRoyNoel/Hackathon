[project]
name = "autopwn"
version = "0.1.0"
description = "Autonomous, authorized CTF/SSH exploitation agent built on the Claude Agent SDK"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
]

[project.scripts]
autopwn = "autopwn.cli:main"
detpwn = "autopwn.det.cli:main"
autopwn-dash = "autopwn.dashboard.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autopwn*"]
